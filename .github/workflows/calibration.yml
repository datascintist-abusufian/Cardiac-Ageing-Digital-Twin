name: calibration-experiment

# Slow (about 5 minutes): runs when the calibration or re-entry model changes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - "cadt/calibration.py"
      - "cadt/reentry.py"
      - "cadt/tissue_sim.py"
      - "examples/calibration_uncertainty.py"
      - ".github/workflows/calibration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run calibration and uncertainty experiment
        run: python examples/calibration_uncertainty.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/calibration_uncertainty.png outputs/calibration_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update calibration outputs [skip ci]"
            git pull --rebase
            git push
          fi
