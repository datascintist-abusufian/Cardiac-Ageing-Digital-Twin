name: reentry-experiment

# Slow (about 4 minutes): runs only when the re-entry model changes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - "cadt/reentry.py"
      - "cadt/tissue_sim.py"
      - "cadt/mapping.py"
      - "examples/reentry_vulnerability.py"
      - ".github/workflows/reentry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run re-entry vulnerability experiment
        run: python examples/reentry_vulnerability.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/reentry_vulnerability.png outputs/reentry_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update re-entry outputs [skip ci]"
            git pull --rebase
            git push
          fi
