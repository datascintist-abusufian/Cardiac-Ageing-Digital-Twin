name: tests-and-figures

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run young-vs-aged example
        run: python examples/young_vs_aged.py
      - name: Commit generated figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/young_vs_aged.png outputs/aged_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update example outputs [skip ci]"
            git push
          fi
